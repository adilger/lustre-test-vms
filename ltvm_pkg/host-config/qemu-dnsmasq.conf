# ltvm's own dnsmasq, run by ltvm-dnsmasq.service.  It reads this file
# and nothing else: /etc/dnsmasq.conf and /etc/dnsmasq.d are the host's.
#
# Only the VM bridge.  --interface adds loopback by itself, so
# except-interface=lo keeps us off 127.0.0.1, where a host resolver may be.
interface=fcbr0
listen-address=192.168.100.1
bind-dynamic
except-interface=lo
no-resolv
# No lease file: the default one is the host dnsmasq's.
leasefile-ro

dhcp-range=192.168.100.10,192.168.100.254,12h
dhcp-option=3,192.168.100.1
dhcp-option=6,8.8.8.8,8.8.4.4
